name: Update CWA Station & Forecast Data and Deploy to GitHub Pages

on:
  schedule:
    # Run every 30 minutes to fetch latest weather observations and 7-day regional forecast
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch live CWA datasets (O-A0003-001 & F-C0032-003) and regenerate stations.json, forecast.json, and data.db
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python scripts/fetch_and_build.py

      - name: Run verification tests
        run: |
          pytest -v
          node --check docs/app.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
